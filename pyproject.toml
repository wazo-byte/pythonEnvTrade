[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-ai-trading"
version = "0.1.0"
description = "A small, deterministic trading research prototype."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "PyYAML>=6.0", "yfinance>=0.2.54"]

[project.scripts]
trading-system = "trading_system.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
